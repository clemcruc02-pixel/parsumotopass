name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: '3.47.9'
      FLUTTER_REVISION: c197ca5199e9ee5661e865596c9c07294dfab51c
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter and Android tooling
        shell: bash
        run: |
          flutter_sdk="$RUNNER_TEMP/flutter-sdk"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$flutter_sdk"
          test "$(git -C "$flutter_sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          export PATH="$flutter_sdk/bin:$PATH"
          flutter precache --android
          flutter pub get --enforce-lockfile

          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is missing}}"
          sdkmanager --sdk_root="$android_sdk" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_sdk" "$android_sdk" > android/local.properties

          # Flutter normally provisions these ignored files before invoking Gradle.
          wrapper="$flutter_sdk/bin/cache/artifacts/gradle_wrapper"
          install -m 0755 "$wrapper/gradlew" android/gradlew
          install -m 0644 "$wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            build/app/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
